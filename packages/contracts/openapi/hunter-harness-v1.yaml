              additionalProperties: false
      responses:
        "200":
          {
            description: Cached or newly generated structured Chinese AI summary,
          }
        "409":
          {
            description: Revision conflict or upstream content changed during generation,
          }
        "422":
          {
            description: Neither a default API provider nor a connected Codex account is available,
          }
        "502":
          { description: AI generation or structured response parsing failed }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/workflow-binding:
    get:
      operationId: getProjectWorkflowBinding
      responses:
        "200":
          {
            description: Current project workflow family binding (family + profile),
          }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: bindProjectWorkflowFamily
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: Project workflow family binding updated with optimistic revision,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/instruction-proposals:
    post:
      operationId: createInstructionProposal
      summary: Audit project guidance and generate a Chinese proposal without applying it
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructionProposalRequest"
      responses:
        "201":
          description: Marker-free Chinese instruction/rule proposal; rule candidates are never auto-applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructionProposal"
        "422":
          { description: Evidence hash mismatch or sensitive content blocked }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/changes/{change_key}/archive-package:
    put:
      operationId: uploadChangeArchivePackage
      summary: Store one verified core-only ZIP, publish its files, and ingest knowledge server-side
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Original ZIP durably stored; receipt includes knowledge indexing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivePackageReceipt"
        "413":
          { description: Archive package exceeds the configured upload limit }
        "409":
          {
            description: A different immutable ZIP already exists for this change,
          }
        "415": { description: Request body is not an application/zip buffer }
        "422":
          {
            description: Unsafe ZIP,
            non-core file,
            manifest/hash mismatch,
            or sensitive content,
          }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: getChangeArchivePackage
      summary: Get durable archive and server-side knowledge status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current archive package receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivePackageReceipt"
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/changes/{change_key}/archive-package/download:
    get:
      operationId: downloadChangeArchivePackage
      summary: Recover the exact original ZIP stored for a change
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Original immutable ZIP; X-Content-SHA256 carries its package hash
          headers:
            X-Content-SHA256:
              schema: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/branches/{branch_name}/remote-sync/content-upload:
    post:
      operationId: stageRemoteContentUpload
      summary: Stage one bounded raw ZIP stream for remote archive processing
      x-hunter-auth-source: authenticated_principal
      x-hunter-project-allowlist-source: server_authority
      x-hunter-project-key-scope: archive:write
      x-hunter-body-transport: single_bounded_stream
      x-hunter-error-codes:
        "400": [VALIDATION_FAILED, REMOTE_CONTENT_UPLOAD_INPUT_INVALID, REMOTE_CONTENT_UPLOAD_STREAM_INVALID, REMOTE_CONTENT_UPLOAD_HASH_MISMATCH, REMOTE_CONTENT_UPLOAD_SIZE_MISMATCH]
        "401": [AUTH_REQUIRED, TOKEN_INVALID, SESSION_INVALID]
        "403": [PROJECT_INFORMATION_FORBIDDEN, PROJECT_KEY_SCOPE, PROJECT_KEY_MISMATCH]
        "409": [REMOTE_CONTENT_UPLOAD_IDEMPOTENCY_CONFLICT]
        "410": [REMOTE_CONTENT_UPLOAD_EXPIRED]
        "413": [REMOTE_CONTENT_UPLOAD_TOO_LARGE]
        "415": [REMOTE_CONTENT_UPLOAD_MEDIA_TYPE_UNSUPPORTED]
        "499": [REMOTE_CONTENT_UPLOAD_ABORTED]
        "503": [REMOTE_UNAVAILABLE]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: branch_name
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: "#/components/parameters/RequestId"
        - name: Content-Length
          in: header
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]{0,8}$", maxLength: 9 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        - name: X-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        - name: X-Upload-Expires-In-Ms
          in: header
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]{0,8}$", maxLength: 9 }
        - name: X-Commit-SHA
          in: header
          schema: { type: string, minLength: 1, maxLength: 240 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1, maxLength: 240 }
        - name: X-Change-Key
          in: header
          schema: { type: string, minLength: 1, maxLength: 240 }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary, maxLength: 536870912 }
      responses:
        "201":
          description: New bounded upload record
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/RemoteContentUploadHttpResult" } } }
        "200":
          description: Idempotent replay of the same complete request identity
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/RemoteContentUploadHttpResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "499": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/branches/{branch_name}/remote-sync/content-upload/status:
    get:
      operationId: getRemoteContentUploadStatus
      summary: Resolve the scoped outcome of one remote content upload identity
      x-hunter-auth-source: authenticated_principal
      x-hunter-project-allowlist-source: server_authority

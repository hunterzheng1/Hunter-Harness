      type: object
      additionalProperties: false
      required: [path, content_kind, size, content_hash]
      properties:
        path: { type: string, minLength: 1 }
        content_kind: { $ref: "#/components/schemas/ContentKind" }
        size: { type: integer, minimum: 0, maximum: 9007199254740991 }
        content_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        action: { $ref: "#/components/schemas/SyncAction" }
    BranchSnapshotPage:
      type: object
      additionalProperties: false
      description: Items are sorted by uploaded_at descending, then branch_name ascending as the unique tie-breaker.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/BranchSnapshot" }
        next_cursor:
          type: string
          minLength: 1
          description: An opaque continuation token; return it unchanged and do not infer ordering from it. Omitted on the terminal page.
    SnapshotVersionPage:
      type: object
      additionalProperties: false
      description: Items are sorted by uploaded_at descending, then artifact_id ascending as the unique tie-breaker.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SnapshotVersion" }
        next_cursor:
          type: string
          minLength: 1
          description: An opaque continuation token; return it unchanged and do not infer ordering from it. Omitted on the terminal page.
    SnapshotFilePage:
      type: object
      additionalProperties: false
      description: Items are sorted by path ascending as the unique tie-breaker within an immutable snapshot.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SnapshotFile" }
        next_cursor:
          type: string
          minLength: 1
          description: An opaque continuation token; return it unchanged and do not infer ordering from it. Omitted on the terminal page.
    LegacyArchiveCompatibilityResult:
      type: object
      additionalProperties: false
      description: Compatibility view for ArchivePackageReceipt. Only durable archive storage is provable; legacy knowledge_status does not imply any split status.
      required:
        - schema_version
        - source_format
        - complete_v1_statuses
        - archive_status
        - change_index_status
        - knowledge_extraction_status
        - managed_snapshot_status
      properties:
        schema_version: { type: integer, const: 1 }
        source_format: { type: string, const: legacy_archive_package_receipt }
        complete_v1_statuses: { type: boolean, const: false }
        archive_status:
          type: object
          additionalProperties: false
          required: [availability, value]
          properties:
            availability: { type: string, const: available }
            value: { $ref: "#/components/schemas/ArchiveStatus" }
        change_index_status:
          type: object
          additionalProperties: false
          required: [availability, reason_code]
          properties:
            availability: { type: string, const: unavailable }
            reason_code:
              { type: string, const: LEGACY_CHANGE_INDEX_STATUS_UNAVAILABLE }
        knowledge_extraction_status:
          type: object
          additionalProperties: false
          required: [availability, reason_code]
          properties:
            availability: { type: string, const: unavailable }
            reason_code:
              type: string
              const: LEGACY_KNOWLEDGE_EXTRACTION_STATUS_UNAVAILABLE
        managed_snapshot_status:
          type: object
          additionalProperties: false
          required: [availability, reason_code]
          properties:
            availability: { type: string, const: unavailable }
            reason_code:
              {
                type: string,
                const: LEGACY_MANAGED_SNAPSHOT_STATUS_UNAVAILABLE,
              }
    InstructionProposalRequest:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          project_profile,
          adapters,
          documents,
          codebase_map,
          recent_changes,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        language: { type: string, const: zh-CN, default: zh-CN }
        project_profile: { type: string, minLength: 1, maxLength: 100 }
        adapters:
          type: array
          maxItems: 4
          items: { type: string, enum: [codex, claude-code, cursor, codebuddy] }
        documents:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [path, content, content_sha256]
            properties:
              path:
                type: string
                enum:
                  - AGENTS.md
                  - CLAUDE.md
                  - CODEBUDDY.md
                  - .harness/rules/project-guidance.md
                  - .cursor/rules/project-guidance.mdc
                  - package.json
                  - pom.xml
                  - build.gradle
                  - build.gradle.kts
                  - pyproject.toml
              content: { type: string, maxLength: 524288 }
              content_sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        codebase_map:
          type: object
          additionalProperties: false
          required: [status, content]
          properties:
            status: { type: string, enum: [missing, stale, fresh] }
            content: { type: string, maxLength: 524288 }
        recent_changes:
          type: array
          maxItems: 20
          description: Optional client hints; server-owned archive summaries are merged first.
          items:
            type: object
            additionalProperties: false
            required: [change_key, summary, decisions]
            properties:
              change_key: { type: string, minLength: 1, maxLength: 160 }
              summary: { type: string, maxLength: 10000 }
              decisions:
                type: array
                maxItems: 50
                items: { type: string, minLength: 1, maxLength: 2000 }
    InstructionProposal:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          proposal_id,
          project_id,
          language,
          mode,
          applied,
          generated_at,
          findings,
          files,
          rule_candidates,
          basis,
          request_id,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        proposal_id:
          { type: string, pattern: "^ipr_[A-Za-z0-9][A-Za-z0-9_-]{0,155}$" }
        project_id: { type: string, pattern: "^prj_" }
        language: { type: string, const: zh-CN }
        mode: { type: string, const: audit-propose }
        applied: { type: boolean, const: false }
        generated_at: { type: string, format: date-time }
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, severity, path, message]
            properties:
              code: { type: string }
              severity: { type: string, enum: [info, warning] }
              path: { type: string }
              message: { type: string }
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [path, operation, base_content_sha256, content_sha256, content]
            properties:
              path:
                type: string
                enum:
                  - AGENTS.md
                  - CLAUDE.md
                  - CODEBUDDY.md
                  - .harness/rules/project-guidance.md
                  - .cursor/rules/project-guidance.mdc
              operation: { type: string, enum: [add, modify] }
              base_content_sha256:
                type: [string, "null"]
                pattern: "^sha256:[a-f0-9]{64}$"
              content_sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
              content: { type: string, maxLength: 1048576 }
        rule_candidates:
          type: array
          description: Evidence-backed candidates with auto_apply=false; not part of apply operations.
          items:
            type: object
            additionalProperties: false
            required:
              [
                candidate_id,
                content,
                evidence,
                evidence_count,
                auto_apply,
                recommendation,
              ]
            properties:
              candidate_id: { type: string, pattern: "^rc_[a-f0-9]{16}$" }
              content: { type: string }
              evidence:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [change_key, summary]
                  properties:
                    change_key: { type: string }
                    summary: { type: string }
              evidence_count: { type: integer, minimum: 1 }
              auto_apply: { type: boolean, const: false }
              recommendation: { type: string, enum: [review, promote] }
        basis: { type: array, items: { type: string, format: uri } }
        request_id: { type: string, format: uuid }
    KnowledgeQueryHttpBudget:
      type: object
      additionalProperties: false
      required: [max_results, max_total_summary_bytes, deadline_ms]
      properties:
        max_results: { type: integer, minimum: 1, maximum: 10 }
        max_total_summary_bytes: { type: integer, minimum: 1, maximum: 65536 }
        deadline_ms: { type: integer, minimum: 1, maximum: 60000 }
    KnowledgeQueryHttpRequest:
      type: object
      additionalProperties: false
      required: [schema_version, project_id, query_id, query_hash, reason_code, query, budget]
      properties:
        schema_version: { type: integer, const: 1 }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,124}$" }
        query_id: { type: string, pattern: "^knowledge_query:[a-f0-9]{64}$" }
        query_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        reason_code: { type: string, enum: [initial_intent, directed_evidence_followup] }
        query: { type: string, minLength: 1, maxLength: 4096 }
        budget: { $ref: "#/components/schemas/KnowledgeQueryHttpBudget" }
    KnowledgeQueryHttpResult:
      type: object
      additionalProperties: false
      required: [result_id, kind, summary, relevance, conflicts_with_intent]
      properties:
        result_id: { type: string, minLength: 1, maxLength: 256 }
        kind: { type: string, enum: [archive_knowledge, implementation_fact, design, rule, change_document] }
        summary: { type: string, minLength: 1, maxLength: 1024 }
        relevance: { type: string, enum: [high, medium, low] }
        source: { type: string, minLength: 1, maxLength: 256 }
        verified_at: { type: string, format: date-time }
        source_version: { type: string, minLength: 1, maxLength: 128 }
        conflicts_with_intent: { type: boolean }
        conflict_summary: { type: string, minLength: 1, maxLength: 1024 }
    KnowledgeQueryHttpReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, receipt_id, query_hash, project_id, result_ids, source_versions, result_set_hash, status, executed_at, reason_code]
      properties:
        schema_version: { type: integer, const: 1 }
        receipt_id: { type: string, pattern: "^knowledge_query_receipt:[a-f0-9]{64}$" }
        query_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,124}$" }
        index_generation: { type: string, minLength: 1, maxLength: 128 }
        result_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
        source_versions:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        result_set_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        status: { type: string, enum: [succeeded, failed] }
        executed_at: { type: string, format: date-time }
        reason_code: { type: string, enum: [initial_intent, directed_evidence_followup, remote_knowledge_unavailable] }
        failure_code: { type: string, minLength: 1, maxLength: 128 }
        supersedes: { type: string, pattern: "^knowledge_query_receipt:[a-f0-9]{64}$" }
    KnowledgeQueryHttpResponse:
      type: object
      additionalProperties: false
      required: [schema_version, query_id, project_id, receipt, results]
      properties:
        schema_version: { type: integer, const: 1 }
        query_id: { type: string, pattern: "^knowledge_query:[a-f0-9]{64}$" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,124}$" }
        receipt: { $ref: "#/components/schemas/KnowledgeQueryHttpReceipt" }
        results:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/KnowledgeQueryHttpResult" }
    PlatformInformationView:
      type: string
      enum:
        [
          branch_monitor,
          branch_files,
          project_materials,
          project_knowledge,
          change_records,
          version_records,
        ]
    PlatformInformationPageState:
      type: string
      enum: [ready, empty, processing, partial_failure, failed, forbidden]
    PlatformInformationContentType:
      type: string
      enum:
        [
          run_event,
          branch_file,
          config,
          rule,
          architecture,
          instruction,
          knowledge_entry,
          change_document,
          archive_package,
          project_content_candidate,
        ]
    PlatformInformationSort:
      type: string
      description: Stable, view-owned ordering. The final field is the unique tie-breaker.
      enum:
        [
          last_event_at_desc_run_id_asc,
          uploaded_at_desc_snapshot_version_asc,
          category_asc_path_asc_version_desc,
          extracted_at_desc_knowledge_id_asc,
          archived_at_desc_change_key_asc,
        ]
    PlatformInformationPath:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "^(?!/)(?!.*\\\\)(?!.*(?:^|/)(?:\\.|\\.\\.)(?:/|$))(?!.*//).+$"
    PlatformInformationQueryScope:
      type: object
      additionalProperties: false
      description: Trusted server Adapter input. The route Adapter derives this scope; clients cannot grant access by submitting it.
      required: [actor_id, accessible_project_ids, content_types]
      properties:
        actor_id: { type: string, minLength: 1, maxLength: 160 }
        accessible_project_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        content_types:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/PlatformInformationContentType" }
    PlatformInformationListHttpQuery:
      type: object
      additionalProperties: false
      description: Public query only; actor, project allowlist, content types, sort and cursor authority are Server-derived.
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
        cursor: { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$", default: null }
    PlatformInformationExportCreateHttpRequest:
      $ref: "#/components/schemas/PlatformInformationListHttpQuery"
    PlatformInformationRetryExtractionHttpRequest:
      type: object
      additionalProperties: false
      required: [job_id, expected_generation]
      description: Actor and project identity are derived from authentication and the path.
      properties:
        job_id:
          { type: string, pattern: "^job_knowledge_[A-Za-z0-9._:-]{1,146}$" }
        expected_generation: { type: integer, minimum: 0 }
    PlatformInformationConfirmRestoreHttpRequest:
      type: object
      additionalProperties: false
      required: [preview_receipt, confirmation_intent]
      properties:
        preview_receipt:
          { $ref: "#/components/schemas/RestoreBranchFilesPreviewReceipt" }
        confirmation_intent:
          { $ref: "#/components/schemas/RestoreBranchFilesConfirmationIntent" }
    RestoreBranchFilesConfirmedIntent:
      type: object
      additionalProperties: false
      description: Request-only, preview-validated output consumed by the local Pull Adapter; it grants no Platform write capability.
      required:
        [
          schema_version,
          contract_kind,
          project_id,
          source_ref,
          source_version,
          scopes,
          selected_paths,
          preview_hash,
          idempotency_key,
          conflict_decisions,
          request_only,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind:
          { type: string, const: branch_files_pull_confirmed_intent }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        source_ref: { $ref: "#/components/schemas/RestoreBranchFilesSourceRef" }
        source_version:
          { $ref: "#/components/schemas/RestoreBranchFilesSourceVersion" }
        scopes:
          {
            type: array,
            prefixItems: [{ type: string, const: branch_files }],
            minItems: 1,
            maxItems: 1,
          }
        selected_paths:
          {
            type: array,
            minItems: 1,
            maxItems: 1000,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/PlatformInformationPath" },
          }
        preview_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        conflict_decisions:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
              [
                path,
                resolution,
                expected_preview_hash,
                source_artifact_id,
                source_project_version,
              ]
            properties:
              path: { $ref: "#/components/schemas/PlatformInformationPath" }
              resolution:
                { type: string, enum: [keep_local, accept_remote, skip] }
              expected_preview_hash:
                { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
              source_artifact_id: { type: string, minLength: 1, maxLength: 160 }
              source_project_version:
                { type: string, minLength: 1, maxLength: 160 }
        request_only: { type: boolean, const: true }
    PlatformInformationQuery:
      type: object
      additionalProperties: false
      description: Bounded storage query. A syntactically bounded opaque token is not trusted until PlatformInformationCursorVerifierPort verifies its actor, project, view and sort binding.
      x-hunter-cross-field-invariants:
        - query_scope.accessible_project_ids contains project_id
        - view fixes the exact query_scope.content_types sequence and sort value
      required:
        [
          schema_version,
          contract_kind,
          view,
          project_id,
          query_scope,
          limit,
          cursor,
          cursor_verification,
          sort,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind: { type: string, const: query }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        query_scope:
          { $ref: "#/components/schemas/PlatformInformationQueryScope" }
        limit: { type: integer, minimum: 1, maximum: 100 }
        cursor:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_-]{16,512}$"
          description: Syntactically bounded opaque continuation token. Consumers return it unchanged; the server Port must verify authenticity and query binding.
        cursor_verification: { type: string, const: server_port_required }
        sort: { $ref: "#/components/schemas/PlatformInformationSort" }
    PlatformInformationBlobRef:
      type: object
      additionalProperties: false
      required: [blob_hash, snapshot_version]
      properties:
        blob_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        snapshot_version: { type: string, minLength: 1, maxLength: 160 }
    PlatformInformationArchiveDownloadRef:
      type: object
      additionalProperties: false
      description: Independent archive-package download identity; it is not a knowledge or document reference.
      required: [archive_id, package_hash]
      properties:
        archive_id: { type: string, minLength: 1, maxLength: 160 }
        package_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    PlatformInformationBranchMonitorItem:
      type: object
      additionalProperties: false
      required:
        [
          item_kind,
          lifecycle_kind,
          run_id,
          branch_name,
          change_key,
          run_status,
          current_phase,
          started_at,
          ended_at,
          duration_ms,
          last_event_at,
          sort_key,
        ]
      properties:
        item_kind: { type: string, const: branch_monitor }
        lifecycle_kind:
          {
            type: string,
            const: change,
            description: Sync is excluded from monitoring.,
          }
        run_id: { type: string, minLength: 1, maxLength: 160 }
        branch_name: { type: string, minLength: 1, maxLength: 512 }
        change_key: { type: string, minLength: 1, maxLength: 160 }
        run_status:
          { type: string, enum: [running, succeeded, failed, partial] }
        current_phase: { type: [string, "null"], minLength: 1, maxLength: 80 }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        last_event_at: { type: string, format: date-time }
        sort_key: { type: string, minLength: 1, maxLength: 512 }
    PlatformInformationBranchSnapshotItem:
      type: object
      additionalProperties: false
      required:
        [
          item_kind,
          branch_name,
          snapshot_version,
          commit_sha,
          uploaded_at,
          file_count,
          changed_file_count,
          sort_key,
        ]
      properties:
        item_kind: { type: string, const: branch_snapshot }
        branch_name: { type: string, minLength: 1, maxLength: 160 }
        snapshot_version: { type: string, minLength: 1, maxLength: 160 }
        commit_sha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
        uploaded_at: { type: string, format: date-time }
        file_count: { type: integer, minimum: 0 }
        changed_file_count: { type: integer, minimum: 0 }
        sort_key: { type: string, minLength: 1, maxLength: 512 }
    PlatformInformationProjectMaterialItem:
      type: object
      additionalProperties: false
      description: A categorized projection referencing the snapshot Blob; it never duplicates the body.
      required:
        [
          item_kind,
          material_id,
          category,
          path,
          blob_ref,
          source_branch_name,
          source_commit_sha,
          sort_key,
        ]
      properties:
        item_kind: { type: string, const: project_material }
        material_id: { type: string, minLength: 1, maxLength: 160 }
        category:
          {
            type: string,
            enum:
              [
                config,
                rule,
                architecture_map,
                architecture_constraint,
                instruction,
              ],
          }
        path: { $ref: "#/components/schemas/PlatformInformationPath" }
        blob_ref: { $ref: "#/components/schemas/PlatformInformationBlobRef" }
        source_branch_name: { type: string, minLength: 1, maxLength: 160 }
        source_commit_sha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
        sort_key: { type: string, minLength: 1, maxLength: 512 }
    PlatformInformationKnowledgeItem:
      type: object
      additionalProperties: false
      description: Reusable knowledge only; rules, architecture, plans, designs and change documents are excluded by query scope.
      required:
        [
          item_kind,
          knowledge_id,
          display_title,
          lifecycle_status,
          source_change_key,
          extracted_at,
          relationship_count,
          sort_key,
        ]
      properties:
        item_kind: { type: string, const: knowledge_entry }
        knowledge_id: { type: string, minLength: 1, maxLength: 160 }
        display_title:
          {
            type: string,
            minLength: 1,
            maxLength: 240,
            description: Explicit producer-owned title; consumers must not infer it from summary or body.,
          }
        lifecycle_status:
          {
            type: string,
            enum:
              [candidate, active, stale, deprecated, superseded, conflicted],
          }
        source_change_key: { type: string, minLength: 1, maxLength: 160 }
        extracted_at: { type: string, format: date-time }
        relationship_count: { type: integer, minimum: 0 }
        sort_key: { type: string, minLength: 1, maxLength: 512 }
    PlatformInformationChangeRecordItem:
      type: object
      additionalProperties: false
      required:
        [
          item_kind,
          change_key,
          title,
          archived_at,
          archive_status,
          knowledge_extraction_status,
          document_refs,
          candidate_count,
          archive_download_ref,
          sort_key,
        ]
      properties:
        item_kind: { type: string, const: change_record }
        change_key: { type: string, minLength: 1, maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 240 }
        archived_at: { type: string, format: date-time }
        archive_status:
          { type: string, enum: [absent, uploading, stored, failed] }
        knowledge_extraction_status:
          {
            type: string,
            enum: [not_scheduled, queued, extracting, ready, failed],
          }
        document_refs:
          {
            type: array,
            maxItems: 20,
            items: { type: string, minLength: 1, maxLength: 160 },
          }
        candidate_count: { type: integer, minimum: 0 }
        archive_download_ref:
          oneOf:
            - {
                $ref: "#/components/schemas/PlatformInformationArchiveDownloadRef",
              }
            - { type: "null" }
        sort_key: { type: string, minLength: 1, maxLength: 512 }
    PlatformInformationVersionRecordItem:
      type: object
      additionalProperties: false
      required:
        [
          item_kind,
          snapshot_version,
          branch_name,
          commit_sha,
          uploaded_at,
          file_count,
          changed_file_count,
          diff_ref,
          sort_key,
        ]
      properties:
        item_kind: { type: string, const: version_record }
        snapshot_version: { type: string, minLength: 1, maxLength: 160 }
        branch_name: { type: string, minLength: 1, maxLength: 160 }
        commit_sha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
        uploaded_at: { type: string, format: date-time }
        file_count: { type: integer, minimum: 0 }
        changed_file_count: { type: integer, minimum: 0 }
        diff_ref: { type: string, minLength: 1, maxLength: 160 }
        sort_key: { type: string, minLength: 1, maxLength: 512 }
    PlatformInformationItem:
      oneOf:
        - { $ref: "#/components/schemas/PlatformInformationBranchMonitorItem" }
        - { $ref: "#/components/schemas/PlatformInformationBranchSnapshotItem" }
        - {
            $ref: "#/components/schemas/PlatformInformationProjectMaterialItem",
          }
        - { $ref: "#/components/schemas/PlatformInformationKnowledgeItem" }
        - { $ref: "#/components/schemas/PlatformInformationChangeRecordItem" }
        - { $ref: "#/components/schemas/PlatformInformationVersionRecordItem" }
      discriminator: { propertyName: item_kind }
    PlatformInformationFailure:
      type: object
      additionalProperties: false
      required: [reason_code, retryable]
      properties:
        reason_code:
          {
            type: string,
            enum:
              [
                PROJECT_INFORMATION_FORBIDDEN,
                PROJECTION_PARTIAL_FAILURE,
                KNOWLEDGE_EXTRACTION_FAILED,
              ],
          }
        retryable: { type: boolean }
    PlatformInformationPage:
      type: object
      additionalProperties: false
      description: Lists contain summaries and references only; body/content is loaded through PlatformInformationDetailResponse.
      oneOf:
        - properties:
            page_state: { type: string, const: ready }
            items: { type: array, minItems: 1, maxItems: 100 }
            failures: { type: array, maxItems: 0 }
        - properties:
            page_state: { type: string, const: empty }
            items: { type: array, maxItems: 0 }
            next_cursor: { type: "null" }
            failures: { type: array, maxItems: 0 }
        - properties:
            page_state: { type: string, const: processing }
            items: { type: array, maxItems: 0 }
            next_cursor: { type: "null" }
            failures: { type: array, maxItems: 0 }
        - properties:
            page_state: { type: string, const: partial_failure }
            items: { type: array, minItems: 1, maxItems: 100 }
            failures:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [reason_code, retryable]
                properties:
                  reason_code:
                    { type: string, const: PROJECTION_PARTIAL_FAILURE }
                  retryable: { type: boolean }
        - properties:
            view: { type: string, const: project_knowledge }
            page_state: { type: string, const: failed }
            items: { type: array, maxItems: 0 }
            next_cursor: { type: "null" }
            failures:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required: [reason_code, retryable]
                properties:
                  reason_code:
                    { type: string, const: KNOWLEDGE_EXTRACTION_FAILED }
                  retryable: { type: boolean, const: true }
        - properties:
            page_state: { type: string, const: forbidden }
            items: { type: array, maxItems: 0 }
            next_cursor: { type: "null" }
            failures:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required: [reason_code, retryable]
                properties:
                  reason_code:
                    { type: string, const: PROJECT_INFORMATION_FORBIDDEN }
                  retryable: { type: boolean }
      required:
        [
          schema_version,
          contract_kind,
          view,
          project_id,
          page_state,
          sort,
          items,
          next_cursor,
          failures,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind: { type: string, const: page }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        page_state:
          { $ref: "#/components/schemas/PlatformInformationPageState" }
        sort: { $ref: "#/components/schemas/PlatformInformationSort" }
        items:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/PlatformInformationItem" },
          }
        next_cursor:
          { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
        failures:
          {
            type: array,
            maxItems: 10,
            items: { $ref: "#/components/schemas/PlatformInformationFailure" },
          }
    PlatformInformationDetailRequest:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          contract_kind,
          view,
          project_id,
          query_scope,
          detail_id,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind: { type: string, const: detail_request }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        query_scope:
          { $ref: "#/components/schemas/PlatformInformationQueryScope" }
        detail_id: { type: string, minLength: 1, maxLength: 160 }
    PlatformInformationContentDetail:
      type: object
      additionalProperties: false
      required: [detail_kind, content, content_hash, media_type]
      properties:
        detail_kind:
          {
            type: string,
            enum:
              [branch_file, project_material, knowledge_entry, change_document],
          }
        content: { type: string, maxLength: 2000000 }
        content_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        media_type:
          {
            type: string,
            enum:
              [text/plain, text/markdown, application/json, application/yaml],
          }
    PlatformInformationMonitorDetail:
      type: object
      additionalProperties: false
      required: [detail_kind, lifecycle_kind, event_refs]
      properties:
        detail_kind: { type: string, const: branch_monitor }
        lifecycle_kind: { type: string, const: change }
        event_refs:
          {
            type: array,
            maxItems: 100,
            items: { type: string, minLength: 1, maxLength: 160 },
          }
    PlatformInformationChangeDetail:
      type: object
      additionalProperties: false
      required:
        [detail_kind, document_refs, candidate_refs, archive_download_ref]
      properties:
        detail_kind: { type: string, const: change_record }
        document_refs:
          {
            type: array,
            maxItems: 20,
            items: { type: string, minLength: 1, maxLength: 160 },
          }
        candidate_refs:
          {
            type: array,
            maxItems: 100,
            items: { type: string, minLength: 1, maxLength: 160 },
          }
        archive_download_ref:
          oneOf:
            - {
                $ref: "#/components/schemas/PlatformInformationArchiveDownloadRef",
              }
            - { type: "null" }
    PlatformInformationVersionDiffDetail:
      type: object
      additionalProperties: false
      required: [detail_kind, from_version, to_version, changed_paths]
      properties:
        detail_kind: { type: string, const: version_diff }
        from_version: { type: string, minLength: 1, maxLength: 160 }
        to_version: { type: string, minLength: 1, maxLength: 160 }
        changed_paths:
          {
            type: array,
            maxItems: 1000,
            items: { $ref: "#/components/schemas/PlatformInformationPath" },
          }
    PlatformInformationDetailResponse:
      type: object
      additionalProperties: false
      required:
        [schema_version, contract_kind, view, project_id, detail_id, detail]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind: { type: string, const: detail_response }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        detail_id: { type: string, minLength: 1, maxLength: 160 }
        detail:
          description: View-specific detail payload. Text bodies are permitted only at this detail seam.
          oneOf:
            - { $ref: "#/components/schemas/PlatformInformationContentDetail" }
            - { $ref: "#/components/schemas/PlatformInformationMonitorDetail" }
            - { $ref: "#/components/schemas/PlatformInformationChangeDetail" }
            - {
                $ref: "#/components/schemas/PlatformInformationVersionDiffDetail",
              }
          discriminator: { propertyName: detail_kind }
    KnowledgeExtractionRetryIntent:
      type: object
      additionalProperties: false
      description: Request-only capability for retrying one failed knowledge extraction generation. It grants no execution authority and carries no token or body.
      x-hunter-cross-field-invariants:
        - intent_hash is the stable canonical hash of actor_id, project_id, job_id, expected_generation, retryable and request_only
      required:
        [
          schema_version,
          contract_kind,
          actor_id,
          project_id,
          job_id,
          expected_generation,
          retryable,
          request_only,
          intent_hash,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind:
          { type: string, const: knowledge_extraction_retry_intent }
        actor_id: { type: string, minLength: 1, maxLength: 160 }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        job_id:
          { type: string, pattern: "^job_knowledge_[A-Za-z0-9._:-]{1,146}$" }
        expected_generation: { type: integer, minimum: 0 }
        retryable: { type: boolean, const: true }
        request_only: { type: boolean, const: true }
        intent_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    RestoreBranchFilesIntent:
      type: object
      additionalProperties: false
      description: Request intent for the stage 02/03 pull-preview seam. This contract cannot write project files.
      x-hunter-cross-field-invariants:
        - selected_paths are unique
      required:
        [
          schema_version,
          contract_kind,
          project_id,
          source_branch_name,
          source_commit_sha,
          source_artifact_id,
          source_project_version,
          scopes,
          selected_paths,
          preview_only,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind: { type: string, const: branch_files_pull_preview_intent }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        source_branch_name: { type: string, minLength: 1, maxLength: 160 }
        source_commit_sha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
        source_artifact_id: { type: string, minLength: 1, maxLength: 160 }
        source_project_version: { type: string, minLength: 1, maxLength: 160 }
        scopes:
          {
            type: array,
            prefixItems: [{ type: string, const: branch_files }],
            minItems: 1,
            maxItems: 1,
          }
        selected_paths:
          {
            type: array,
            minItems: 1,
            maxItems: 1000,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/PlatformInformationPath" },
          }
        preview_only: { type: boolean, const: true }
    RestoreBranchFilesSourceRef:
      type: object
      additionalProperties: false
      required: [project_id, branch_name, commit_sha, client_id]
      properties:
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        branch_name: { type: string, minLength: 1, maxLength: 160 }
        commit_sha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
        client_id: { type: string, minLength: 1, maxLength: 160 }
    RestoreBranchFilesSourceVersion:
      type: object
      additionalProperties: false
      required: [branch_name, commit_sha, artifact_id, project_version]
      properties:
        branch_name: { type: string, minLength: 1, maxLength: 160 }
        commit_sha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
        artifact_id: { type: string, minLength: 1, maxLength: 160 }
        project_version: { type: string, minLength: 1, maxLength: 160 }
    RestoreBranchFilesPreviewReceipt:
      type: object
      additionalProperties: false
      description: Read-only stage 02 pull preview projection. It carries no file body and grants no write capability.
      x-hunter-cross-field-invariants:
        - source_ref.project_id equals project_id
        - source_ref.branch_name and commit_sha equal source_version branch_name and commit_sha
        - selected_paths and conflict paths are unique
        - every conflict path is in selected_paths
      required:
        [
          schema_version,
          contract_kind,
          project_id,
          source_ref,
          source_version,
          scopes,
          selected_paths,
          preview_hash,
          conflicts,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind:
          { type: string, const: branch_files_pull_preview_receipt }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        source_ref: { $ref: "#/components/schemas/RestoreBranchFilesSourceRef" }
        source_version:
          { $ref: "#/components/schemas/RestoreBranchFilesSourceVersion" }
        scopes:
          {
            type: array,
            prefixItems: [{ type: string, const: branch_files }],
            minItems: 1,
            maxItems: 1,
          }
        selected_paths:
          {
            type: array,
            minItems: 1,
            maxItems: 1000,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/PlatformInformationPath" },
          }
        preview_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        conflicts:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [path, reason_code]
            properties:
              path: { $ref: "#/components/schemas/PlatformInformationPath" }
              reason_code:
                {
                  type: string,
                  enum: [SYNC_CONTENT_CONFLICT, SYNC_RENAME_TARGET_CONFLICT],
                }
    RestoreBranchFilesConfirmationIntent:
      type: object
      additionalProperties: false
      description: The only final Platform restore output. The stage 02/03 Pull Adapter consumes it after preview; Platform never writes project files directly.
      oneOf:
        - properties:
            action: { type: string, const: continue }
        - properties:
            action: { type: string, enum: [review, stop] }
            conflict_decisions: { type: array, maxItems: 0 }
      required:
        [
          schema_version,
          contract_kind,
          project_id,
          source_ref,
          source_version,
          scopes,
          preview_hash,
          action,
          idempotency_key,
          conflict_decisions,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind:
          { type: string, const: branch_files_pull_confirmation_intent }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        source_ref: { $ref: "#/components/schemas/RestoreBranchFilesSourceRef" }
        source_version:
          { $ref: "#/components/schemas/RestoreBranchFilesSourceVersion" }
        scopes:
          {
            type: array,
            prefixItems: [{ type: string, const: branch_files }],
            minItems: 1,
            maxItems: 1,
          }
        preview_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        action: { type: string, enum: [continue, review, stop] }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        conflict_decisions:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
              [
                path,
                resolution,
                expected_preview_hash,
                source_artifact_id,
                source_project_version,
              ]
            properties:
              path: { $ref: "#/components/schemas/PlatformInformationPath" }
              resolution:
                { type: string, enum: [keep_local, accept_remote, skip] }
              expected_preview_hash:
                { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
              source_artifact_id: { type: string, minLength: 1, maxLength: 160 }
              source_project_version:
                { type: string, minLength: 1, maxLength: 160 }
    PlatformInformationExportResult:
      type: object
      additionalProperties: false
      description: Proof of an export-all cursor walk, bound to the complete trusted query range. The first request cursor may be null exactly when the source cursor is null; every subsequent request cursor is unique and non-null.
      x-hunter-cross-field-invariants:
        - first request_cursor equals range.source_cursor
        - range query_scope, limit, cursor_verification and sort equal the trusted source query
        - range content types and sort match view policy and project_id belongs to the actor allowlist
        - subsequent request_cursor values and non-terminal response_next_cursor values are non-null and unique
        - each response_next_cursor equals the next request_cursor
        - the final response_next_cursor is null
        - each result_count is no greater than range.limit
        - exported_count equals the sum of result_count
      required:
        [
          schema_version,
          contract_kind,
          view,
          project_id,
          range,
          pages,
          exported_count,
          completed,
        ]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind: { type: string, const: export_all_result }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        range:
          type: object
          additionalProperties: false
          required:
            [query_scope, limit, source_cursor, cursor_verification, sort]
          properties:
            query_scope:
              { $ref: "#/components/schemas/PlatformInformationQueryScope" }
            limit: { type: integer, minimum: 1, maximum: 100 }
            source_cursor:
              { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
            cursor_verification: { type: string, const: server_port_required }
            sort: { $ref: "#/components/schemas/PlatformInformationSort" }
        pages:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [request_cursor, response_next_cursor, result_count]
            properties:
              request_cursor:
                { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
              response_next_cursor:
                { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
              result_count: { type: integer, minimum: 0, maximum: 100 }
        exported_count: { type: integer, minimum: 0, maximum: 1000000 }
        completed: { type: boolean, const: true }
    PlatformInformationExportRange:
      type: object
      additionalProperties: false
      required: [query_scope, limit, source_cursor, cursor_verification, sort]
      properties:
        query_scope: { $ref: "#/components/schemas/PlatformInformationQueryScope" }
        limit: { type: integer, minimum: 1, maximum: 100 }
        source_cursor:
          { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
        cursor_verification: { type: string, const: server_port_required }
        sort: { $ref: "#/components/schemas/PlatformInformationSort" }
    PlatformInformationExportPageProof:
      type: object
      additionalProperties: false
      required: [request_cursor, response_next_cursor, result_count]
      properties:
        request_cursor:
          { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
        response_next_cursor:
          { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{16,512}$" }
        result_count: { type: integer, minimum: 0, maximum: 100 }
    PlatformInformationExportM4Proof:
      type: object
      additionalProperties: false
      description: Complete M4 cursor walk plus the canonical item-line accumulator produced during that walk.
      required: [pages, exported_count, items_sha, completed]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/PlatformInformationExportPageProof" }
        exported_count: { type: integer, minimum: 0, maximum: 1000000 }
        items_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        completed: { type: boolean, const: true }
    PlatformInformationExportArtifactSummary:
      type: object
      additionalProperties: false
      description: content_sha hashes every artifact byte. items_sha hashes the concatenation of each exact canonical item line plus its LF, excluding manifest and footer.
      required:
        [format, media_type, content_sha, items_sha, byte_count, item_count, page_count]
      properties:
        format: { type: string, const: canonical_jsonl_v1 }
        media_type: { type: string, const: application/x-ndjson }
        content_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        items_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        byte_count: { type: integer, minimum: 1, maximum: 536870912 }
        item_count: { type: integer, minimum: 0, maximum: 1000000 }
        page_count: { type: integer, minimum: 1, maximum: 10000 }
    PlatformInformationExportDownloadRef:
      type: object
      additionalProperties: false
      required: [export_id, project_id, content_sha]
      properties:
        export_id: { type: string, minLength: 1, maxLength: 160 }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        content_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    PlatformInformationExportArtifactReceipt:
      type: object
      additionalProperties: false
      description: A bounded ready receipt for a canonical JSONL export artifact. Item bodies remain in the downloadable stream and are never embedded in this receipt.
      x-hunter-cross-field-invariants:
        - m4_proof is a complete PlatformInformationExportResult proof for project_id, view and range
        - artifact item_count and page_count equal the M4 exported count and proof page count; artifact.items_sha equals m4_proof.items_sha
        - download_ref identities equal export_id, project_id and artifact.content_sha
        - proof_sha hashes canonical JSON of schema_version, export_id, project_id, view, range and m4_proof, whose items_sha binds the streamed item lines without a content/proof cycle
        - incremental readers reject empty chunks and chunks larger than 1048576 bytes before decoding
        - expires_at is later than created_at
      required:
        [schema_version, contract_kind, export_id, project_id, view, range, m4_proof, proof_sha, artifact, download_ref, status, created_at, expires_at]
      properties:
        schema_version: { type: integer, const: 1 }
        contract_kind:
          { type: string, const: platform_information_export_artifact_receipt }
        export_id: { type: string, minLength: 1, maxLength: 160 }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        range: { $ref: "#/components/schemas/PlatformInformationExportRange" }
        m4_proof: { $ref: "#/components/schemas/PlatformInformationExportM4Proof" }
        proof_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        artifact: { $ref: "#/components/schemas/PlatformInformationExportArtifactSummary" }
        download_ref: { $ref: "#/components/schemas/PlatformInformationExportDownloadRef" }
        status: { type: string, const: ready }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PlatformInformationExportManifestLine:
      type: object
      additionalProperties: false
      description: Exactly one first line. UTF-8, canonical JSON, one LF terminator, and no BOM or CR bytes are permitted.
      required:
        [schema_version, line_kind, format, export_id, project_id, view, range, m4_proof, proof_sha, created_at, expires_at]
      properties:
        schema_version: { type: integer, const: 1 }
        line_kind: { type: string, const: manifest }
        format: { type: string, const: canonical_jsonl_v1 }
        export_id: { type: string, minLength: 1, maxLength: 160 }
        project_id: { type: string, pattern: "^prj_[A-Za-z0-9_-]{1,156}$" }
        view: { $ref: "#/components/schemas/PlatformInformationView" }
        range: { $ref: "#/components/schemas/PlatformInformationExportRange" }
        m4_proof: { $ref: "#/components/schemas/PlatformInformationExportM4Proof" }
        proof_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PlatformInformationExportItemLine:
      type: object
      additionalProperties: false
      description: A one-based contiguous ordinal. item_sha hashes the UTF-8 canonical JSON bytes of item only; the complete canonical line contributes to items_sha.
      required: [schema_version, line_kind, ordinal, item_sha, item]
      properties:
        schema_version: { type: integer, const: 1 }
        line_kind: { type: string, const: item }
        ordinal: { type: integer, minimum: 1, maximum: 1000000 }
        item_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        item: { $ref: "#/components/schemas/PlatformInformationItem" }
    PlatformInformationExportFooterLine:
      type: object
      additionalProperties: false
      description: Exactly one final line, followed by one LF and no further bytes. Hashes and counts must equal the receipt and observed stream.
      required:
        [schema_version, line_kind, export_id, proof_sha, items_sha, item_count, page_count]
      properties:
        schema_version: { type: integer, const: 1 }
        line_kind: { type: string, const: footer }
        export_id: { type: string, minLength: 1, maxLength: 160 }
        proof_sha: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }

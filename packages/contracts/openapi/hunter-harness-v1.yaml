      responses:
        "201":
          description: Workflow family created with a reviewable profile draft
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/WorkflowFamilySourceImportResult",
                }
        "409":
          {
            description: "Workflow family slug already exists, or source content changed after preflight (WORKFLOW_SOURCE_CHANGED)",
          }
        "422":
          {
            description: Source profiles are incomplete or the GitHub subpath is invalid,
          }
        "502": { description: Upstream npm or GitHub request failed }
        "504": { description: Upstream npm or GitHub request timed out }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/workflow-families/{slug}:

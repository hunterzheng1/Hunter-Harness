          {
            description: npm package or GitHub repository not found (EXTERNAL_SOURCE_NOT_FOUND),
          }
        "422":
          {
            description: GitHub subpath missing or no workflow profiles detected,
          }
        "502": { description: Upstream npm or GitHub request failed }
        "504": { description: Upstream npm or GitHub request timed out }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/workflow-families/import:
    post:
      operationId: importWorkflowFamilySource

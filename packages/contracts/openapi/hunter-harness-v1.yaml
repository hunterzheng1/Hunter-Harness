      properties:
        version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
        sourceAgent: { $ref: "#/components/schemas/SkillTargetAgent" }
        draftRevision: { type: integer, minimum: 1 }
        releaseNote: { type: string, minLength: 1, maxLength: 2000 }
    PublishSkillResponse:
      type: object
      additionalProperties: false

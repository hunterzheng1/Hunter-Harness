        "422":
          {
            description: Family has no source or the source lacks required profile bundles,
          }
        "502": { description: Upstream npm or GitHub request failed }
        "504": { description: Upstream npm or GitHub request timed out }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/workflow-families/{slug}/npm-release:

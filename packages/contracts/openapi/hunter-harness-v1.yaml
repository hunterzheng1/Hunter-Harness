        "404": [PLATFORM_INFORMATION_EXPORT_NOT_FOUND]
        "410": [PLATFORM_INFORMATION_EXPORT_EXPIRED]
        "503": [PLATFORM_INFORMATION_EXPORT_DOWNLOAD_UNAVAILABLE]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PlatformInformationView"
        - name: export_id
          in: path
          required: true
          schema: { type: string, pattern: "^export_[A-Za-z0-9_-]{1,156}$" }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Canonical JSONL export stream
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Content-Disposition: { schema: { type: string } }
            X-Content-SHA256:
              schema: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/information/{view}/{detail_id}:
    get:
      operationId: getPlatformInformationDetail
      summary: Read one authorized project information detail by stable identity
      x-hunter-auth-source: authenticated_principal
      x-hunter-project-allowlist-source: server_authority
      x-hunter-project-key-scope-by-view:
        {
          branch_monitor: "platform:read",
          branch_files: "files:read",
          project_materials: "files:read",
          project_knowledge: "knowledge:read",
          change_records: "files:read",
          version_records: "files:read",
        }
      x-hunter-error-codes:
        "400": [VALIDATION_FAILED]
        "401": [AUTH_REQUIRED, TOKEN_INVALID, SESSION_INVALID]
        "403": [PROJECT_INFORMATION_FORBIDDEN, PROJECT_KEY_SCOPE, PROJECT_KEY_MISMATCH]
        "404": [PLATFORM_INFORMATION_DETAIL_NOT_FOUND]
        "503": [PLATFORM_INFORMATION_SOURCE_INVALID, PLATFORM_INFORMATION_UNAVAILABLE]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PlatformInformationView"
        - $ref: "#/components/parameters/PlatformInformationDetailId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Canonical information detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInformationDetailResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/information/branch-files:preview-restore:
    post:
      operationId: previewBranchFilesRestore
      summary: Create a read-only branch file restore preview
      x-hunter-auth-source: authenticated_principal
      x-hunter-project-allowlist-source: server_authority
      x-hunter-project-key-scope: "files:read"
      x-hunter-error-codes:
        "400": [VALIDATION_FAILED]
        "401": [AUTH_REQUIRED, TOKEN_INVALID, SESSION_INVALID]
        "403": [PROJECT_INFORMATION_FORBIDDEN, PROJECT_KEY_SCOPE, PROJECT_KEY_MISMATCH]
        "422": [BRANCH_FILES_RESTORE_PREVIEW_INVALID]
        "503": [PLATFORM_INFORMATION_SOURCE_INVALID, PLATFORM_INFORMATION_UNAVAILABLE]
      parameters:
        [
          { $ref: "#/components/parameters/ProjectId" },
          { $ref: "#/components/parameters/RequestId" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/RestoreBranchFilesIntent" },
                },
            },
        }
      responses:
        "200":
          description: Canonical read-only restore preview receipt
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreBranchFilesPreviewReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/information/branch-files:confirm-restore:
    post:
      operationId: confirmBranchFilesRestore
      summary: Validate preview-bound conflict decisions and return a request-only Pull intent
      x-hunter-auth-source: authenticated_principal
      x-hunter-project-allowlist-source: server_authority
      x-hunter-project-key-scope: "files:read"
      x-hunter-validator-id: validatePlatformInformationConfirmRestoreHttpRequest
      x-hunter-error-codes:
        "400": [VALIDATION_FAILED]
        "401": [AUTH_REQUIRED, TOKEN_INVALID, SESSION_INVALID]
        "403": [PROJECT_INFORMATION_FORBIDDEN, PROJECT_KEY_SCOPE, PROJECT_KEY_MISMATCH]
        "409": [BRANCH_FILES_PULL_CONFIRMATION_MISMATCH]
        "422": [BRANCH_FILES_PULL_CONFIRMATION_INVALID]
      parameters:
        [
          { $ref: "#/components/parameters/ProjectId" },
          { $ref: "#/components/parameters/RequestId" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/PlatformInformationConfirmRestoreHttpRequest",
                    },
                },
            },
        }
      responses:
        "200":
          description: Canonical request-only confirmed Pull intent
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreBranchFilesConfirmedIntent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}/information/knowledge:retry-extraction:
    post:
      operationId: retryProjectKnowledgeExtraction
      summary: Create a request-only knowledge extraction retry intent
      x-hunter-auth-source: authenticated_principal
      x-hunter-project-allowlist-source: server_authority
      x-hunter-project-key-scope: "knowledge:write"
      x-hunter-error-codes:
        "400": [VALIDATION_FAILED]
        "401": [AUTH_REQUIRED, TOKEN_INVALID, SESSION_INVALID]
        "403": [PROJECT_INFORMATION_FORBIDDEN, PROJECT_KEY_SCOPE, PROJECT_KEY_MISMATCH]
        "404": [KNOWLEDGE_EXTRACTION_JOB_NOT_FOUND]
        "409": [KNOWLEDGE_EXTRACTION_GENERATION_CONFLICT]
        "422": [KNOWLEDGE_EXTRACTION_RETRY_REQUEST_INVALID]
        "503": [KNOWLEDGE_EXTRACTION_RETRY_INTENT_INVALID, KNOWLEDGE_EXTRACTION_RETRY_AUTHORITY_INVALID, PLATFORM_INFORMATION_UNAVAILABLE]
      parameters:
        [
          { $ref: "#/components/parameters/ProjectId" },
          { $ref: "#/components/parameters/RequestId" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/PlatformInformationRetryExtractionHttpRequest",
                    },
                },
            },
        }
      responses:
        "200":
          description: Canonical request-only retry intent
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeExtractionRetryIntent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    RemoteSyncIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 240
        pattern: "^[!-~]+$"
    KnowledgeQueryIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 240
        pattern: "^[!-~]+$"
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^prj_[A-Za-z0-9_-]{1,124}$"
    PlatformInformationView:
      name: view
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PlatformInformationView" }
    PlatformInformationDetailId:
      name: detail_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    ChangeKey:
      name: change_key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
    ContentSha256:
      name: content_sha256
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type:
          - string
          - "null"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SkillSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Agent:
      name: agent
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RegistryAgent"
  schemas:
    SchemaVersionRequest:
      type: object
      additionalProperties: false
      required: [schema_version]
      properties:
        schema_version: { type: integer, const: 1 }
    NpmPublishingCredentialReplaceRequest:
      type: object
      additionalProperties: false
      required: [schema_version, token, expires_at]
      properties:
        schema_version: { type: integer, const: 1 }
        token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          format: password
          description: npm Granular Access Token; never returned or logged
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Operator-recorded token expiration used to block expired publishing credentials
    NpmPublishingCredentialStatus:
      type: object
      additionalProperties: false
      required:
        [
          scope,
          source,
          state,
          username,
          expires_at,
          last_verified_at,
          can_manage,
        ]
      properties:
        scope: { type: [string, "null"] }
        source: { type: string, enum: [none, deployment, managed] }
        state:
          {
            type: string,
            enum: [not_configured, configured, ready, expired, invalid, locked],
          }
        username: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        last_verified_at: { type: [string, "null"], format: date-time }
        can_manage:
          type: boolean
          description: Whether the server has a valid encryption key for page-managed credentials
        request_id: { type: string, format: uuid }
    CodexModelOption:
      type: object
      additionalProperties: false
      required: [id, display_name, is_default, reasoning_efforts]
      properties:
        id: { type: string }
        display_name: { type: string }
        is_default: { type: boolean }
        reasoning_efforts:
          type: array
          items: { type: string }
    CodexConnectionState:
      type: object
      additionalProperties: true
      required:
        [
          status,
          auth_mode,
          email,
          plan_type,
          enabled,
          selected_model,
          models,
          error,
        ]
      properties:
        status: { type: string, enum: [connected, disconnected, unavailable] }
        auth_mode: { type: [string, "null"], enum: [chatgpt, null] }
        email: { type: [string, "null"] }
        plan_type: { type: [string, "null"] }
        enabled:
          type: boolean
          description: Whether Codex is the single platform-wide active model source
        selected_model: { type: [string, "null"] }
        models:
          type: array
          items: { $ref: "#/components/schemas/CodexModelOption" }
        error: { type: [string, "null"] }
        request_id: { type: string, format: uuid }
    CodexLoginStart:
      type: object
      additionalProperties: true
      required: [login_id, verification_url, user_code]
      properties:
        login_id: { type: string }
        verification_url: { type: string, format: uri }
        user_code: { type: string }
        request_id: { type: string, format: uuid }
    DashboardOverview:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - window
        - metrics
        - trend
        - distributions
        - ai_usage
        - active_runs
        - health
        - services
        - activity
      properties:
        generated_at:
          type: string
          format: date-time
        window:
          type: object
          required: [days, starts_at, ends_at]
        metrics:
          type: object
          description: Counts sourced from the authenticated actor's project repository and canonical Skill Registry.
        trend:
          type: array
          description: Daily proposal submissions and recorded review outcomes for the requested window.
          items:
            type: object
        distributions:
          type: object
          description: Skill, Workflow, and project knowledge distribution counts.
        ai_usage:
          type: array
          description: Daily AI request, token, and estimated cost totals for the requested window.
          items:
            type: object
        active_runs:
          type: array
          description: Most recently active project runs visible to the authenticated actor.
          items:
            type: object
        health:
          type: array
          description: Explainable governance checks; unavailable means insufficient evidence rather than success.
          items:
            type: object
        services:
          type: array
          description: Data-source read signals, not synthetic infrastructure telemetry.
          items:
            type: object
        activity:
          type: array
          description: Sanitized audit event metadata; audit details are never returned.
          items:
            type: object
    ProjectResolveRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - local_project_key
        - display_name
        - client_id
      properties:
        schema_version:
          const: 1
        local_project_key:
          type: string
          format: uuid
        display_name:
          type: string
        requested_project_id:
          type:
            - string
            - "null"
        client_id:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
            - details
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
            details:
              type: object
    RegistryAgent:
      type: string
      enum: ["claude-code", "codex", "cursor", "codebuddy", "generic", "mcp"]
    SkillTargetAgent:
      type: string
      enum: ["claude-code", "codex", "cursor", "codebuddy"]
    RegistrySlug:
      type: string
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    AgentToolSource:
      type: object
      additionalProperties: false
      required: [type, ref]
      properties:
        type: { type: string, enum: [github, npm, website] }
        ref:
          type: string
          minLength: 1
          maxLength: 1000
          description: Exact curator-provided source; GitHub tree branch and subpath are preserved
    CreateAgentToolRequest:
      type: object
      additionalProperties: false
      required:
        [schema_version, slug, displayName, description, category, source]
      properties:
        schema_version: { type: integer, const: 1 }
        slug: { $ref: "#/components/schemas/RegistrySlug" }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1200 }
        category:
          {
            type: string,
            enum: [harness, runtime, orchestrator, ade, cli, framework],
          }
        status:
          {
            type: string,
            enum: [active, experimental, archived],
            default: active,
          }
        source: { $ref: "#/components/schemas/AgentToolSource" }
        homepage: { type: [string, "null"], format: uri }
        packageName: { type: [string, "null"], maxLength: 220 }
        installCommand: { type: [string, "null"], maxLength: 500 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/RegistrySlug" }
          default: []
        relatedWorkflowFamilies:
          type: array
          items: { $ref: "#/components/schemas/RegistrySlug" }
          default: []
    AgentTool:
      type: object
      additionalProperties: false
      required:
        [
          tool_id,
          slug,
          displayName,
          description,
          category,
          status,
          source,
          homepage,
          packageName,
          installCommand,
          tags,
          relatedWorkflowFamilies,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        tool_id: { type: string, pattern: "^atl_" }
        slug: { $ref: "#/components/schemas/RegistrySlug" }
        displayName: { type: string }
        description: { type: string }
        category:
          {
            type: string,
            enum: [harness, runtime, orchestrator, ade, cli, framework],
          }
        status: { type: string, enum: [active, experimental, archived] }
        source: { $ref: "#/components/schemas/AgentToolSource" }
        homepage: { type: [string, "null"], format: uri }
        packageName: { type: [string, "null"] }
        installCommand: { type: [string, "null"] }
        tags:
          { type: array, items: { $ref: "#/components/schemas/RegistrySlug" } }
        relatedWorkflowFamilies:
          { type: array, items: { $ref: "#/components/schemas/RegistrySlug" } }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        request_id: { type: string, format: uuid }
    InspectAgentToolGithubRequest:
      type: object
      additionalProperties: false
      required: [schema_version, github_url]
      properties:
        schema_version: { type: integer, const: 1 }
        github_url: { type: string, minLength: 1, maxLength: 1000 }
    AgentToolGithubInspection:
      type: object
      additionalProperties: false
      required: [source, suggested]
      properties:
        source: { $ref: "#/components/schemas/AgentToolSource" }
        suggested: { $ref: "#/components/schemas/AgentToolSuggestion" }
        request_id: { type: string, format: uuid }
    GenerateAgentToolPrefillRequest:
      type: object
      additionalProperties: false
      required: [schema_version, inspection]
      properties:
        schema_version: { type: integer, const: 1 }
        inspection:
          { $ref: "#/components/schemas/AgentToolGithubInspectionInput" }
    AgentToolGithubInspectionInput:
      type: object
      additionalProperties: false
      required: [source, suggested]
      properties:
        source: { $ref: "#/components/schemas/AgentToolSource" }
        suggested: { $ref: "#/components/schemas/AgentToolSuggestion" }
    AgentToolSuggestion:
      type: object
      additionalProperties: false
      required:
        [
          slug,
          displayName,
          description,
          category,
          status,
          source,
          tags,
          relatedWorkflowFamilies,
        ]
      properties:
        slug: { $ref: "#/components/schemas/RegistrySlug" }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1200 }
        category:
          {
            type: string,
            enum: [harness, runtime, orchestrator, ade, cli, framework],
          }
        status: { type: string, enum: [active, experimental, archived] }
        source: { $ref: "#/components/schemas/AgentToolSource" }
        homepage: { type: [string, "null"], format: uri }
        packageName: { type: [string, "null"], maxLength: 220 }
        installCommand: { type: [string, "null"], maxLength: 500 }
        tags:
          { type: array, items: { $ref: "#/components/schemas/RegistrySlug" } }
        relatedWorkflowFamilies:
          { type: array, items: { $ref: "#/components/schemas/RegistrySlug" } }
    WorkflowFamilySource:
      type: object
      additionalProperties: false
      required: [type, ref]
      properties:
        type: { type: string, enum: [npm, github] }
        ref:
          type: string
          minLength: 1
          maxLength: 1000
          description: npm package name or exact GitHub repository/tree URL
    InspectWorkflowFamilySourceRequest:
      type: object
      additionalProperties: false
      required: [schema_version, source]
      properties:
        schema_version: { type: integer, const: 1 }
        source: { $ref: "#/components/schemas/WorkflowFamilySource" }
    WorkflowFamilySourceInspection:
      type: object
      additionalProperties: false
      required:
        [
          source,
          remote_version,
          source_digest,
          manifest_detected,
          ready,
          suggested,
          profiles,
          warnings,
        ]
      properties:
        source: { $ref: "#/components/schemas/WorkflowFamilySource" }
        remote_version:
          { type: [string, "null"], pattern: "^\\d+\\.\\d+\\.\\d+$" }
        source_digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        manifest_detected: { type: boolean }
        ready: { type: boolean }
        suggested:
          type: object
          additionalProperties: false
          required: [slug, displayName, description, tags]
          properties:
            slug: { $ref: "#/components/schemas/RegistrySlug" }
            displayName: { type: string }
            description: { type: string }
            tags:
              {
                type: array,
                items: { $ref: "#/components/schemas/RegistrySlug" },
              }
        profiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [profile, file_count]
            properties:
              profile: { $ref: "#/components/schemas/RegistrySlug" }
              file_count: { type: integer, minimum: 1 }
        warnings: { type: array, items: { type: string } }
        request_id: { type: string, format: uuid }
    WorkflowFamilySyncResult:
      type: object
      additionalProperties: false
      required: [updated, request_id]
      properties:
        updated: { type: boolean }
        version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
        request_id: { type: string, format: uuid }
    ImportWorkflowFamilySourceRequest:
      type: object
      additionalProperties: false
      required:
        [schema_version, source, source_digest, slug, displayName, description]
      properties:
        schema_version: { type: integer, const: 1 }
        source: { $ref: "#/components/schemas/WorkflowFamilySource" }
        source_digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        slug: { $ref: "#/components/schemas/RegistrySlug" }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        tags:
          {
            type: array,
            items: { $ref: "#/components/schemas/RegistrySlug" },
            default: [],
          }
    WorkflowFamilySourceImportResult:
      type: object
      additionalProperties: false
      required: [family, draft, inspection, request_id]
      properties:
        family:
          type: object
          additionalProperties: false
          description: Created WorkflowFamily registry record
          required:
            [
              family_id,
              slug,
              displayName,
              description,
              tags,
              latest_version,
              required_profiles,
              revision,
              npmReleases,
              source,
              created_at,
              updated_at,
            ]
          properties:
            family_id: { type: string, pattern: "^wff_" }
            slug: { $ref: "#/components/schemas/RegistrySlug" }
            displayName: { type: string, minLength: 1, maxLength: 120 }
            description: { type: string, minLength: 1, maxLength: 1000 }
            tags:
              {
                type: array,
                items: { $ref: "#/components/schemas/RegistrySlug" },
              }
            latest_version:
              { type: [string, "null"], pattern: "^\\d+\\.\\d+\\.\\d+$" }
            required_profiles:
              {
                type: array,
                minItems: 1,
                items: { $ref: "#/components/schemas/RegistrySlug" },
              }
            revision: { type: integer, minimum: 1 }
            npmReleases:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [version, packageName, status, publishedAt, error]
                properties:
                  version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
                  packageName: { type: string, minLength: 1 }
                  status: { type: string, enum: [published, failed, conflict] }
                  publishedAt: { type: string, format: date-time }
                  error: { type: [string, "null"] }
            source: { $ref: "#/components/schemas/WorkflowFamilySource" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        draft:
          type: object
          additionalProperties: false
          description: Lightweight staged draft metadata; source contents remain in artifact storage
          required:
            [
              family_slug,
              profiles,
              required_profiles,
              draftVersion,
              checks,
              releaseNote,
              revision,
              created_at,
              updated_at,
            ]
          properties:
            family_slug: { $ref: "#/components/schemas/RegistrySlug" }
            profiles:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [profile, file_count]
                properties:
                  profile: { $ref: "#/components/schemas/RegistrySlug" }
                  file_count: { type: integer, minimum: 0 }
            required_profiles:
              {
                type: array,
                minItems: 1,
                items: { $ref: "#/components/schemas/RegistrySlug" },
              }
            draftVersion:
              { type: [string, "null"], pattern: "^\\d+\\.\\d+\\.\\d+$" }
            checks:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [items, summary, checkedAt]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          [id, label, status, message, filePath, fixable]
                        properties:
                          id: { type: string }
                          label: { type: string }
                          status: { type: string, enum: [green, yellow, red] }
                          message: { type: string }
                          filePath: { type: [string, "null"] }
                          fixable: { type: boolean }
                    summary:
                      type: object
                      additionalProperties: false
                      required: [green, yellow, red]
                      properties:
                        green: { type: integer, minimum: 0 }
                        yellow: { type: integer, minimum: 0 }
                        red: { type: integer, minimum: 0 }
                    checkedAt: { type: string }
            releaseNote: { type: [string, "null"] }
            revision: { type: integer, minimum: 1 }
            created_at: { type: string }
            updated_at: { type: string }
            request_id: { type: string, format: uuid }
        inspection:
          { $ref: "#/components/schemas/WorkflowFamilySourceInspection" }
        request_id: { type: string, format: uuid }
    WorkflowFamilyVersionSummary:
      type: object
      additionalProperties: false
      required:
        [family_slug, version, profiles, artifacts, changeNote, created_at]
      properties:
        family_slug: { $ref: "#/components/schemas/RegistrySlug" }
        version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
        profiles:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [profile, bundle_manifest, artifact_id, file_count]
            properties:
              profile: { $ref: "#/components/schemas/RegistrySlug" }
              artifact_id: { type: string, pattern: "^wfb_" }
              file_count: { type: integer, minimum: 0 }
              bundle_manifest:
                type: object
                additionalProperties: false
                required: [schema_version, profile, files]
                properties:
                  schema_version: { type: integer, const: 1 }
                  profile: { $ref: "#/components/schemas/RegistrySlug" }
                  files:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [path, sha256]
                      properties:
                        path: { type: string, minLength: 1 }
                        sha256:
                          { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                artifact_id,
                family_slug,
                profile,
                version,
                content_sha256,
                size_bytes,
                bundle_manifest,
                created_at,
              ]
            properties:
              artifact_id: { type: string, pattern: "^wfb_" }
              family_slug: { $ref: "#/components/schemas/RegistrySlug" }
              profile: { $ref: "#/components/schemas/RegistrySlug" }
              version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
              content_sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
              size_bytes: { type: integer, minimum: 0 }
              bundle_manifest:
                {
                  $ref: "#/components/schemas/WorkflowFamilyVersionSummary/properties/profiles/items/properties/bundle_manifest",
                }
              created_at: { type: string, format: date-time }
        changeNote: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        request_id: { type: string, format: uuid }
    SensitiveReviewSubmission:
      type: object
      additionalProperties: false
      required: [scanner_version, finding_fingerprints, reason]
      properties:
        scanner_version: { type: string, minLength: 1 }
        finding_fingerprints:
          type: array
          minItems: 1
          items: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        reason: { type: string, minLength: 3, maxLength: 500 }
    PublishUnifiedSkillRequest:
      type: object

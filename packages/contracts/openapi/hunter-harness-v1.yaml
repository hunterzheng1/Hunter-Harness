        archive_id:
          { type: string, pattern: "^arc_[A-Za-z0-9][A-Za-z0-9._:-]{0,155}$" }
        package_sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        manifest_sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        project_version:

      properties:
        release:
          type: object
          additionalProperties: false
          required: [slug, version]
          properties:
            slug: { type: string }
            version: { type: string }
        npmRelease:
          type: object
          additionalProperties: false
          required: [status, packageName, version, tarballHash]
          properties:
            status: { type: string, enum: [published, idempotent] }
            packageName: { type: string }
            version: { type: string }
            tarballHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    SetDefaultAgentRequest:
      type: object

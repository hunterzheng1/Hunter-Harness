    post:
      operationId: createExternalSkill
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          {
            description: External skill registered after fetching upstream metadata,
          }
        "404":
          { description: Upstream source not found (EXTERNAL_SOURCE_NOT_FOUND) }
        "409":
          {
            description: Same npm/GitHub source already registered (EXTERNAL_SKILL_EXISTS),

openapi: 3.1.0
info:
  title: Hunter Harness API
  version: 1.1.0
servers:
  - url: https://harness.example.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Process liveness
  /api/v1/dashboard/overview:
    get:
      operationId: getDashboardOverview
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 7
            maximum: 30
            default: 7
      responses:
        "200":
          description: Authenticated governance metrics, trend, health checks, service reads, and sanitized audit activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:resolve:
    post:
      operationId: resolveProject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectResolveRequest"
      responses:
        "200":
          description: Project created or bound
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project registry page
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project metadata
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/proposal-sessions:
    post:
      operationId: createProposalSession
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Upload session created
        default:
          $ref: "#/components/responses/Error"
  /api/v1/proposal-sessions/{session_id}/blobs:query:
    post:
      operationId: queryBlobs
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Present and missing blob hashes
        default:
          $ref: "#/components/responses/Error"
  /api/v1/proposal-sessions/{session_id}/blobs/{content_sha256}:
    put:
      operationId: uploadBlob
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Chunk accepted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/proposal-sessions/{session_id}:finalize:
    post:
      operationId: finalizeProposal
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeProposalRequest"
      responses:
        "201":
          description: Proposal auto-approved and artifact published
        "409":
          description: Server already has a newer artifact for this project; re-sync base_artifact_id before finalizing again (STALE_PUSH)
        "422":
          description: Sensitive content scan blocked the proposal (SENSITIVE_CONTENT_BLOCKED); error.details may include finding_count, scanner_version, and findings summary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/proposals:
    get:
      operationId: listProposals
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Proposal page
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Approved artifact history page
        default:
          $ref: "#/components/responses/Error"
  /api/v1/proposals/{proposal_id}:
    get:
      operationId: getProposal
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Proposal details
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/update-manifest:
    get:
      operationId: getUpdateManifest
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Approved artifact delta metadata
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{artifact_id}/manifest:
    get:
      operationId: getArtifactManifest
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Immutable artifact manifest
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{artifact_id}/blobs/{content_sha256}:
    get:
      operationId: downloadArtifactBlob
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/ContentSha256"
      responses:
        "200":
          description: Artifact blob
        default:
          $ref: "#/components/responses/Error"
  /api/v1/skills:
    get:
      operationId: listSkills
      responses:
        "200": { description: Canonical Skill Registry }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skill-catalog/order:
    get:
      operationId: getSkillCatalogOrder
      responses:
        "200":
          {
            description: Persisted manual ordering for local and external skill cards,
          }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateSkillCatalogOrder
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, revision]
              properties:
                items:
                  type: array
                  maxItems: 10000
                  uniqueItems: true
                  items:
                    {
                      type: string,
                      pattern: "^(registry|external):[A-Za-z0-9][A-Za-z0-9._-]*$",
                    }
                revision: { type: integer, minimum: 0 }
      responses:
        "200": { description: Skill card order saved }
        "409": { description: Skill card order revision conflict }
        "422": { description: Order contains an unknown skill }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}:
    get:
      operationId: getSkill
      responses:
        "200": { description: Canonical Skill detail }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSkill
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          { description: Skill and its draft, versions, and artifacts deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/versions:
    get:
      operationId: listSkillVersions
      parameters:
        - name: agent
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RegistryAgent"
          description: Filter versions by agent; when omitted all versions are returned. An invalid agent returns 422 VALIDATION_FAILED.
      responses:
        "200":
          {
            description: Published Skill versions,
            optionally filtered by agent,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/adapter-preview/{agent}:
    get:
      operationId: previewSkillAdapter
      responses:
        "200":
          {
            description: Verified published adapter output preview for any installable adapter (claude-code/codex/cursor/generic); mcp returns 422 ADAPTER_NOT_IMPLEMENTED,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/artifacts/{agent}/download:
    get:
      operationId: downloadSkillArtifact
      responses:
        "200": { description: Approved adapter ZIP with SHA-256 headers }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/draft:
    post:
      operationId: uploadSkillDraft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: agent
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SkillTargetAgent"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
                sensitive_review:
                  $ref: "#/components/schemas/SensitiveReviewSubmission"
      responses:
        "201": { description: Skill source variant draft created or updated }
        "409":
          {
            description: Review fingerprints or scanner version are stale (SENSITIVE_REVIEW_STALE),
          }
        "413":
          {
            description: Upload or review payload exceeds server limits (SKILL_UPLOAD_TOO_LARGE),
          }
        "422":
          {
            description: Bundle invalid,
            high-risk content blocked,
            or explicit sensitive review required,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}:
    get:
      operationId: getSkillDraft
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          {
            description: Unpublished per-agent Skill draft with source files and checks,
          }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: discardSkillDraft
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Per-agent Skill draft discarded }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/checks:
    post:
      operationId: runSkillDraftChecks
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Programmatic per-agent Skill draft check results }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/ai-checks:
    post:
      operationId: runSkillDraftAiChecks
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: "Starts async AI check job; returns jobId with status pending. Poll GET /api/v1/ai-jobs/{jobId} for result. 429 QUOTA_EXCEEDED if daily limit reached",
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/fix-preview:
    post:
      operationId: previewSkillDraftFix
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
      responses:
        "200": { description: Fix plan preview without persisting }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/apply-fix:
    post:
      operationId: applySkillDraftFix
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Updated per-agent skill draft after applying fix }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/release-note:generate:
    post:
      operationId: generateSkillDraftReleaseNote
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: AI-generated release note persisted to per-agent draft.releaseNote (degraded on AI failure),
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/fix-suggestions:
    post:
      operationId: fetchSkillDraftFixSuggestions
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          {
            description: AI-generated fix suggestions as a read-only FixPlan preview,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/apply-fix-suggestion:
    post:
      operationId: applySkillDraftFixSuggestion
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: Updated per-agent skill draft after applying an AI fix suggestion,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/publish:
    post:
      operationId: publishSkillDraft
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: Per-agent Skill draft promoted to a new published version with one artifact for the specified agent,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/publish:
    post:
      operationId: publishUnifiedSkill
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishUnifiedSkillRequest"
      responses:
        "200":
          description: Registry release and scoped public npm publication completed atomically from the caller perspective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishSkillResponse"
        "409":
          {
            description: Draft revision/version conflict or remote package digest conflict,
          }
        "422":
          { description: Sensitive content or target variant validation failed }
        "502":
          {
            description: npm registry rejected or failed publication (NPM_PUBLISH_FAILED),
          }
        "503":
          {
            description: npm scope or token secret is not configured (NPM_PUBLISH_NOT_CONFIGURED),
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/npm-release:
    post:
      operationId: releaseSkillToNpm
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: Latest published skill version released to npm as a data-only package,
          }
        "503":
          {
            description: npm publish is not configured on the server (NPM_PUBLISH_NOT_CONFIGURED),
          }
        "502":
          {
            description: npm registry rejected publication (NPM_PUBLISH_FAILED),
          }
        "409":
          {
            description: npm registry already has this package version (NPM_PUBLISH_CONFLICT),
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/draft/{agent}/diff:
    get:
      operationId: diffSkillDraft
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/Agent"
      responses:
        "200": { description: Published vs per-agent draft source file diff }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skills/{slug}/default-agent:
    patch:
      operationId: setSkillDefaultAgent
      parameters:
        - $ref: "#/components/parameters/SkillSlug"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultAgentRequest"
      responses:
        "200":
          { description: Skill default agent switched with optimistic revision }
        "401": { description: Auth required }
        "422":
          {
            description: Agent not enabled for this skill (AGENT_NOT_ENABLED) or request body validation failed,
          }
        "409": { description: Skill revision conflict (REVISION_CONFLICT) }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/system/npm-publishing:
    get:
      operationId: getNpmPublishingCredentialStatus
      summary: Read the server-wide npm publishing credential status
      description: Owner session only. The response never contains the credential token or encrypted envelope.
      responses:
        "200":
          description: Active managed or deployment credential metadata
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/NpmPublishingCredentialStatus" }
        "403": { description: A human Owner session is required }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/system/npm-publishing/credential:
    put:
      operationId: replaceNpmPublishingCredential
      summary: Verify and atomically replace the managed npm credential
      description: Owner session only. The write-only token is verified with npm before its encrypted envelope replaces the active managed credential.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/NpmPublishingCredentialReplaceRequest",
              }
      responses:
        "200":
          description: Managed credential verified and encrypted
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/NpmPublishingCredentialStatus" }
        "403": { description: A human Owner session is required }
        "422":
          {
            description: npm rejected the credential or the supplied expiration has passed,
          }
        "503":
          { description: The server credential-encryption key is unavailable }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeNpmPublishingCredential
      summary: Remove the managed credential and fall back to the deployment secret
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaVersionRequest" }
      responses:
        "200":
          description: Managed credential removed; response describes the active fallback
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/NpmPublishingCredentialStatus" }
        "403": { description: A human Owner session is required }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/system/npm-publishing/verify:
    post:
      operationId: verifyNpmPublishingCredential
      summary: Verify the active credential against npm
      description: Owner session only. Managed credentials are decrypted only in memory for the verification request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaVersionRequest" }
      responses:
        "200":
          description: Active credential identity verified
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/NpmPublishingCredentialStatus" }
        "403": { description: A human Owner session is required }
        "422":
          { description: npm rejected the active credential or it has expired }
        "503": { description: The managed credential cannot be decrypted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/providers:
    get:
      operationId: listAiProviders
      responses:
        "200":
          {
            description: API-key provider configurations without secrets; Codex account authorization is managed by its independent endpoint,
          }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAiProvider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: API-key provider created }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/providers/{provider_id}:
    patch:
      operationId: updateAiProvider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: API-key provider updated }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAiProvider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: AI provider deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/providers/{provider_id}/test:
    post:
      operationId: testAiProvider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: AI provider connectivity test result }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/codex:
    get:
      operationId: getCodexConnection
      responses:
        "200":
          description: ChatGPT account connection and the models currently visible to Codex; never contains tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodexConnectionState" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCodexConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version]
              anyOf:
                - required: [selected_model]
                - required: [enabled]
              properties:
                schema_version: { const: 1 }
                selected_model: { type: [string, "null"] }
                enabled:
                  type: boolean
                  description: Enables Codex as the single platform-wide model source; enabling it disables every API provider
      responses:
        "200":
          description: Codex default model or platform-wide enabled state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodexConnectionState" }
        "409": { description: ChatGPT account is not connected }
        "422": { description: Model is not available for this account }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectCodex
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          {
            description: ChatGPT account disconnected and Codex model preference cleared,
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/codex/login:
    post:
      operationId: startCodexLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version]
              properties:
                schema_version: { const: 1 }
      responses:
        "200":
          description: Official ChatGPT device-code authorization instructions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodexLoginStart" }
        "503": { description: Codex App Server is unavailable }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/codex/login/cancel:
    post:
      operationId: cancelCodexLogin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, login_id]
              properties:
                schema_version: { const: 1 }
                login_id: { type: string, minLength: 1 }
      responses:
        "200":
          { description: Pending ChatGPT device-code authorization cancelled }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/codex/test:
    post:
      operationId: testCodexConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version]
              properties:
                schema_version: { const: 1 }
      responses:
        "200":
          { description: Codex account and selected-model connectivity result }
        "409": { description: ChatGPT account is not connected }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-config/usage:
    get:
      operationId: getAiUsage
      responses:
        "200":
          {
            description: Per-provider per-day AI quota usage statistics (UTC date roll),
          }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai-jobs/{jobId}:
    get:
      operationId: getAiJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Async AI job state (pending/running/completed/failed); completed carries SkillCheckResult in result, failed carries error message. slug+agent are dedup key (R2).
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  slug: { type: string, description: dedup key part 1 }
                  agent:
                    {
                      type: string,
                      enum: [claude-code, codex, cursor, generic, mcp],
                    }
                  status:
                    {
                      type: string,
                      enum: [pending, running, completed, failed],
                    }
                  result: { description: SkillCheckResult or null }
                  error: { type: string, nullable: true }
                  createdAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
        "404": { description: Job not found or expired (JOB_NOT_FOUND) }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/skill-artifacts:
    get:
      operationId: listSkillArtifacts

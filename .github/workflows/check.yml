name: check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full check
        run: npm run check

      - name: Generate CI evidence receipt
        if: success()
        run: |
          node scripts/ci/generate-evidence-receipt.mjs \
            --workflow check \
            --job check-linux \
            --step "Run full check" \
            --command "npm run check" \
            --conclusion success \
            --out "$RUNNER_TEMP/ci-evidence-receipt.json"

      - name: Upload CI evidence receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-receipt-${{ github.run_id }}-check-linux
          if-no-files-found: error
          path: ${{ runner.temp }}/ci-evidence-receipt.json

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows test shard ${{ matrix.shard }}/2
        run: npm test -- --shard=${{ matrix.shard }}/2

      - name: Generate CI evidence receipt
        if: success()
        run: |
          node scripts/ci/generate-evidence-receipt.mjs `
            --workflow check `
            --job "test-windows-unit" `
            --step "Run unit tests" `
            --command "npm test -- --shard=${{ matrix.shard }}/2" `
            --conclusion success `
            --out "$env:RUNNER_TEMP\ci-evidence-receipt.json"

      - name: Upload CI evidence receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-receipt-${{ github.run_id }}-test-windows-${{ matrix.shard }}
          if-no-files-found: error
          path: ${{ runner.temp }}/ci-evidence-receipt.json

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run packaged CLI smoke test
        run: npm run smoke:pack

  node22-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack public CLI
        run: |
          npm run build -w packages/contracts
          npm run build -w packages/core
          npm run build -w packages/cli
          mkdir -p .compat
          npm pack -w packages/cli --ignore-scripts --pack-destination .compat

      - name: Setup consumer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.17"

      - name: Verify packaged CLI on Node.js 22.17
        shell: bash
        run: |
          mkdir -p .compat/install
          cd .compat/install
          npm init -y >/dev/null
          npm install ../hunter-harness-*.tgz --ignore-scripts
          node node_modules/hunter-harness/dist/bin.js --help
